<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Model Preview</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #222;
    }
    canvas {
      display: block;
    }
  </style>

  <!-- 1. Three.js 本体 (r128系) の読み込み -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- 2. カメラ操作用 (OrbitControls) の読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <!-- 3. 作成したモデルJSファイルを読み込み -->
  <script src="./piyo.js"></script>
  <!-- ※ パンダやイヌネコを表示したい時は上の行を panda.js や dogcat.js に変えるだけ！ -->
</head>
<body>
  <script>
    // --------------------------------------------------
    // シーン・カメラ・レンダラーの設定
    // --------------------------------------------------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x333333);

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.set(0, 1.5, 3.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // マウスドラッグでカメラをぐるぐる回せるようにする
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // ライトの設定（明るく照らす）
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(3, 5, 4);
    scene.add(dirLight);

    // --------------------------------------------------
    // モデルの呼び出しと配置
    // --------------------------------------------------
    // piyo.js の中で定義されている createChick() を実行！
    if (typeof createChick === 'function') {
      const chick = createChick();
      scene.add(chick);
    } else {
      console.error("createChick 関数が見つかりません。piyo.js の読み込みを確認してください。");
    }

    // 床の目安（グリッド線）
    const gridHelper = new THREE.GridHelper(10, 10);
    scene.add(gridHelper);

    // --------------------------------------------------
    // アニメーションループ & ウィンドウサイズ調整
    // --------------------------------------------------
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
